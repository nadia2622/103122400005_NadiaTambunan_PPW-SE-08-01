<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1>Hello, World!</h1>

    <h2 class="text-danger">ini bootstrap</h2>

    <!-- container with bootstrap -->
    <div class="container">
      <div class="row">
        <div class="col-4 bg-primary text-white">Kolom 1</div>
        <div class="col-4 bg-success text-white">Kolom 2</div>
        <div class="col-4 bg-danger text-white">Kolom 3</div>
      </div>
    </div>

    <h2>ini adalah table</h2>
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead class="fw-bold">
          <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Nama</th>
            <th colspan="3">Alamat</th>
            <th rowspan="2">Umur</th>
          </tr>
          <tr>
            <th>Desa</th>
            <th>Kecamatan</th>
            <th>Kabutapen</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">1</th>
            <td>Budi Rojadi</td>
            <td>Ledug</td>
            <td>Kembaran</td>
            <td>Banyumas</td>
            <td>34</td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Yulia Santi</td>
            <td>Penari</td>
            <td>Abc</td>
            <td>ghi</td>
            <td>44</td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>Fahri Abdilah</td>
            <td>Petani</td>
            <td>Def</td>
            <td>jkl</td>
            <td>23</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"
  ></script>
</html>
